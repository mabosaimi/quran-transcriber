<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quran Transcriber</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1 class="title" data-i18n="extName">Quran Transcriber</h1>
        <span id="status" class="status status--idle" data-i18n="statusIdle" role="status" aria-live="polite">Ready</span>
      </header>

      <main class="main">
        <div id="error-banner" class="error-banner" hidden role="alert"></div>

        <div id="placeholder-view" class="placeholder-view">
          <div class="placeholder-icon">
            <svg class="icon-quran" viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
              <path d="M6 6h10"/>
              <path d="M6 10h10"/>
              <path d="M6 14h6"/>
            </svg>
          </div>
          <p id="placeholder-text" class="placeholder-text" data-i18n="readyToListen">Play Quran recitation in any tab and click Start Listening.</p>
          <div id="listening-indicator" class="listening-wave" hidden>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <article id="ayah-card" class="ayah-card" hidden aria-live="polite">
          <header class="ayah-card__header">
            <div class="ayah-card__surah-info">
              <span id="surah-arabic" class="ayah-card__surah-arabic" dir="rtl" lang="ar"></span>
              <span id="surah-english" class="ayah-card__surah-english"></span>
            </div>
            <div id="ayah-badge" class="ayah-card__badge"></div>
          </header>

          <div class="ayah-card__body">
            <p id="ayah-text" class="ayah-card__text" dir="rtl" lang="ar"></p>
          </div>
        </article>

        <div id="live-speech-strip" class="live-speech" hidden>
          <span class="live-speech__dot" aria-hidden="true"></span>
          <span id="live-speech-text" class="live-speech__text" dir="rtl" lang="ar"></span>
        </div>
      </main>

      <footer class="footer">
        <div id="idle-hint" class="idle-hint" hidden>
          <p class="idle-hint__text" data-i18n="clickIconToStart">Click the extension icon in the browser toolbar to start listening to the active tab.</p>
        </div>
        <button id="toggle-btn" class="btn btn--primary" type="button"
                data-i18n="startCapture">Start Listening</button>
      </footer>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
